[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "jogak"
dynamic = ["version"]
description = "한국어 규정·법령·공문서의 구조(장·조·항·호·목)를 지키는 RAG 청킹 라이브러리"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []
keywords = ["rag", "chunking", "text-splitter", "korean", "law", "청킹", "법령", "한국어"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: Korean",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
[project.urls]
Homepage = "https://github.com/MSbtff/jogak"
Issues = "https://github.com/MSbtff/jogak/issues"

[project.optional-dependencies]
kiwi = ["kiwipiepy>=0.18"]
tiktoken = ["tiktoken>=0.7"]
hf = ["tokenizers>=0.19"]
langchain = ["langchain-text-splitters>=0.3"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
jogak = "jogak.cli:main"

[tool.hatch.version]
path = "src/jogak/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/jogak"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
pythonpath = ["src", "."]
addopts = "--doctest-modules"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # 한글 문서 속 전각 문자 허용
